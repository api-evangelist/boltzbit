aid: boltzbit
name: Boltzbit
description: >-
  Boltzbit builds General Learning Intelligence (GLI) — AI systems that
  organizations can own, train, and control, learning continuously from
  proprietary data rather than depending on static, vendor-controlled models.
  Its product suite forms an operating system for AI-native software: BoltzHub, a
  marketplace where creators sell AI-powered apps and consumers subscribe to
  them; BoltzAgent, a self-learning assistant for research-backed chat, document
  editing, and production-ready code generation; BoltzLearn, an LLM fine-tuning
  platform for building custom models from your own data; and BoltzCloud, a
  multi-cloud deployment backbone across GCP, AWS, and Azure. Boltzbit is backed
  by Speedinvest. The company references an API product surface but does not yet
  publish public API documentation, an OpenAPI specification, SDKs, or a
  developer portal; this profile will be enriched as those surfaces are released.
